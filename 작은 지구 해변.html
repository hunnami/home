<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 지구 해변 · 지구를 도는 어린왕자</title>
<meta name="description" content="파도 소리가 들리는 3D 바다에서 지구를 도는 어린왕자, 지구니, 강아지, 고양이와 함께하는 작은 지구 해변.">
<meta name="theme-color" content="#0b1c2c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f8f5a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f3dcb4; --sand-deep:#d9b787; --sea:#0b1c2c;
  --glass:rgba(11,26,42,.46); --glass-hi:rgba(255,255,255,.14);
  --ink:#f6f1e7; --ink-dim:rgba(246,241,231,.72); --accent:#ffb87a; --accent-2:#7fd7e8;
  --panel-bg:rgba(10,22,36,.82); --panel-line:rgba(255,255,255,.13);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#08131f;color:var(--ink);overflow:hidden;
  font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(2,10,18,.34) 100%)}
button{font:inherit;color:inherit}

/* ---------- 상단 바 ---------- */
header.bar{position:fixed;z-index:6;top:0;left:0;right:0;
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) clamp(14px,3vw,30px) 14px;
  pointer-events:none}
header.bar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:"Gowun Batang",serif;font-size:19px;
  letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.55);white-space:nowrap}
.brand .orb{width:22px;height:22px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 33% 30%,#9ee7ff,#2f8f5a 52%,#14532d 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 18px rgba(120,220,190,.55),inset -4px -5px 9px rgba(0,0,0,.45);
  animation:orbPulse 6s ease-in-out infinite}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.btn{appearance:none;cursor:pointer;border-radius:999px;padding:9px 16px;font-size:13.5px;
  border:1px solid rgba(255,255,255,.3);background:rgba(9,22,36,.42);color:#fff;
  backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);
  transition:background .22s,border-color .22s,transform .18s,box-shadow .22s;white-space:nowrap}
.btn:hover{background:rgba(9,22,36,.66);border-color:rgba(255,255,255,.55);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.on{background:rgba(255,184,122,.9);border-color:#ffd9b6;color:#28170a;font-weight:700;
  box-shadow:0 4px 22px rgba(255,170,110,.35)}
.btn .ic{font-size:14px;margin-right:5px}

/* 시간대 세그먼트 */
.seg{display:flex;padding:3px;gap:2px;border-radius:999px;border:1px solid rgba(255,255,255,.28);
  background:rgba(9,22,36,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg button{cursor:pointer;border:0;background:none;border-radius:999px;padding:7px 13px;font-size:13px;
  color:rgba(255,255,255,.82);transition:background .25s,color .25s;white-space:nowrap}
.seg button:hover{color:#fff;background:rgba(255,255,255,.12)}
.seg button.on{background:linear-gradient(180deg,rgba(255,220,170,.98),rgba(255,178,110,.95));color:#26160a;
  font-weight:700;box-shadow:0 2px 12px rgba(255,180,120,.4)}

/* ---------- 힌트 ---------- */
#hint{position:fixed;z-index:5;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  max-width:min(94vw,760px);padding:9px 16px;border-radius:999px;font-size:12.5px;line-height:1.5;
  color:rgba(255,255,255,.9);background:rgba(8,20,32,.5);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;
  transition:opacity .5s,transform .5s}
#hint.hide{opacity:0;transform:translate(-50%,10px);pointer-events:none}
#hint b{color:var(--accent);font-weight:400}

/* ---------- 패널 ---------- */
aside#panel{position:fixed;z-index:8;top:0;right:0;bottom:0;width:min(460px,100vw);
  display:flex;flex-direction:column;
  background:var(--panel-bg);border-left:1px solid var(--panel-line);
  backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:-28px 0 70px rgba(0,0,0,.45);
  transform:translateX(102%);transition:transform .78s cubic-bezier(.6,0,.18,1);
  padding-top:env(safe-area-inset-top,0px)}
body.open aside#panel{transform:none}
@media (min-width:861px){
  header.bar{transition:padding-right .7s cubic-bezier(.6,0,.18,1)}
  body.open header.bar{padding-right:calc(min(460px,100vw) + 16px)}
}
.phead{display:flex;align-items:center;gap:4px;padding:16px 14px 0;border-bottom:1px solid var(--panel-line)}
.tab{appearance:none;background:none;border:0;cursor:pointer;font-size:15.5px;color:var(--ink-dim);
  padding:10px 14px;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .2s,border-color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:#fff;border-color:var(--accent)}
.phead .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-dim);padding-right:4px}
.phead .live i{width:7px;height:7px;border-radius:50%;background:#6ee7a8;box-shadow:0 0 8px #6ee7a8;display:inline-block}
.phead .live.off i{background:#ffb35c;box-shadow:0 0 8px #ffb35c}
.x{margin-left:6px;background:none;border:0;cursor:pointer;color:var(--ink-dim);font-size:19px;padding:6px 12px;border-radius:10px;line-height:1}
.x:hover{background:rgba(255,255,255,.1);color:#fff}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px calc(26px + env(safe-area-inset-bottom,0px))}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:8px}
.pbody section[hidden]{display:none}

.note{font-size:12px;line-height:1.6;color:var(--ink-dim);background:rgba(255,255,255,.05);
  border:1px solid var(--panel-line);border-radius:12px;padding:10px 12px;margin-bottom:16px}
.note code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#ffd6ab}
.note b{color:#fff;font-weight:400}

form.compose{display:grid;gap:9px;margin-bottom:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
input,textarea{font:inherit;font-size:14.5px;color:#fff;width:100%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;
  padding:11px 13px;transition:border-color .2s,background .2s}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.38)}
input:focus,textarea:focus{outline:none;border-color:rgba(255,184,122,.75);background:rgba(255,255,255,.11)}
textarea{resize:vertical;min-height:84px;line-height:1.6}
.submit{cursor:pointer;border:0;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;
  color:#2a1809;background:linear-gradient(180deg,#ffd7a8,#ffb072);
  box-shadow:0 6px 22px rgba(255,165,105,.28);transition:transform .18s,filter .2s}
.submit:hover{filter:brightness(1.06);transform:translateY(-1px)}
.submit:disabled{opacity:.55;cursor:progress;transform:none}
.count{font-size:12px;color:var(--ink-dim);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.count button{background:none;border:0;color:var(--accent-2);cursor:pointer;font-size:12px;padding:2px 4px;text-decoration:underline}
.card{border-top:1px solid var(--panel-line);padding:14px 2px;animation:fadeUp .5s both}
.card:first-of-type{border-top:0}
.card h3{margin:0 0 5px;font-size:15.5px;font-weight:400;color:#fff;letter-spacing:.01em}
.meta{font-size:11.5px;color:var(--ink-dim);margin-bottom:8px}
.card p{margin:0;white-space:pre-wrap;line-height:1.68;font-size:14px;color:rgba(255,255,255,.93);overflow-wrap:anywhere}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;
  background:linear-gradient(150deg,#2d7a5a,#1e5b8a);color:#eafff6;margin-right:8px;vertical-align:-7px}
.empty{text-align:center;padding:34px 10px;color:var(--ink-dim);font-size:13.5px;line-height:1.8}
.empty .big{display:block;font-size:30px;margin-bottom:8px;opacity:.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 토스트 */
#toast{position:fixed;z-index:20;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  background:rgba(12,24,38,.92);border:1px solid rgba(255,255,255,.18);color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;max-width:88vw;text-align:center;
  backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 로딩 */
#boot{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#08131f;
  transition:opacity .9s ease .1s;font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.06em}
#boot.done{opacity:0;pointer-events:none}
#boot .ring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
  border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:860px){
  .brand{font-size:15.5px;gap:8px}
  .brand .orb{width:18px;height:18px}
  .btn{padding:8px 12px;font-size:12.5px}
  .seg button{padding:6px 11px;font-size:12px}
  header.bar{gap:8px;align-items:center}
  .tools{gap:6px}
  /* 하단 컨트롤 */
  .seg{position:fixed;left:50%;bottom:calc(54px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);z-index:7;background:rgba(9,22,36,.62)}
  #soundBtn{position:fixed;right:14px;bottom:calc(52px + env(safe-area-inset-bottom,0px));z-index:7;
    padding:9px 12px;font-size:12px}
  #soundBtn .ic{margin-right:0}
  #hint{bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:10.5px;padding:6px 12px}
  body.open .seg, body.open #soundBtn{opacity:0;pointer-events:none}
  aside#panel{top:auto;height:64vh;width:100%;border-left:0;border-top:1px solid var(--panel-line);
    border-radius:22px 22px 0 0;transform:translateY(103%);padding-top:0}
  body.open aside#panel{transform:none}
  #hint{font-size:11.5px;padding:8px 13px}
  .pbody{padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){
  aside#panel{transition-duration:.01s}
  .brand .orb{animation:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D 바다와 지구 장면"></canvas>
<div id="vignette"></div>

<header class="bar">
  <div class="brand"><span class="orb"></span> 작은 지구 해변</div>
  <div class="tools">
    <div class="seg" role="group" aria-label="시간대 선택">
      <button type="button" data-mode="sunrise">일출</button>
      <button type="button" data-mode="noon" class="on">오후 3시</button>
      <button type="button" data-mode="sunset">노을</button>
    </div>
    <button class="btn" type="button" id="soundBtn"><span class="ic">🔊</span>파도 소리</button>
    <button class="btn" type="button" id="boardBtn" data-open="board">게시판</button>
    <button class="btn" type="button" id="guestBtn" data-open="guest">방명록</button>
  </div>
</header>

<div id="hint">
  <span>화면을 한 번 누르면 <b>파도 소리</b>가 시작돼요 · <b>지구를 도는 어린왕자 🌹</b> · <b>방향키</b>로 지구 이동 · <b>우클릭 드래그</b>로 회전</span>
</div>

<aside id="panel" aria-label="게시판과 방명록">
  <div class="phead" role="tablist">
    <button class="tab" role="tab" data-tab="board" aria-selected="true">게시판</button>
    <button class="tab" role="tab" data-tab="guest" aria-selected="false">방명록</button>
    <span class="live" id="liveBadge"><i></i><span id="liveText">연결 중</span></span>
    <button class="x" type="button" id="closeBtn" aria-label="닫기">✕</button>
  </div>
  <div class="pbody">
    <section id="sec-board">
      <form class="compose" id="boardForm" autocomplete="off">
        <div class="row">
          <input name="name" maxlength="24" placeholder="이름" aria-label="이름" required>
          <input name="title" maxlength="80" placeholder="제목" aria-label="제목" required>
        </div>
        <textarea name="body" maxlength="2000" placeholder="바다에 남기고 싶은 이야기를 적어 주세요" aria-label="내용" required></textarea>
        <button class="submit" type="submit">글 올리기</button>
      </form>
      <p class="count"><span id="boardCount">불러오는 중…</span><button type="button" data-refresh="board">새로고침</button></p>
      <div id="boardList"></div>
    </section>
    <section id="sec-guest" hidden>
      <form class="compose" id="guestForm" autocomplete="off">
        <input name="name" maxlength="24" placeholder="이름" aria-label="이름" required>
        <textarea name="message" maxlength="400" placeholder="방명록에 한 줄 남겨 주세요" aria-label="방명록 내용" required></textarea>
        <button class="submit" type="submit">방명록 남기기</button>
      </form>
      <p class="count"><span id="guestCount">불러오는 중…</span><button type="button" data-refresh="guest">새로고침</button></p>
      <div id="guestList"></div>
    </section>
  </div>
</aside>

<div id="toast" role="status" aria-live="polite"></div>
<div id="boot"><div><div class="ring"></div>바다를 준비하고 있어요…</div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   작은 지구 해변 · 3D
   ========================================================================== */
const canvas   = document.getElementById('scene');
const isSmall  = () => innerWidth <= 860;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isSmall() ? 1.6 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 2000);
const clock  = new THREE.Clock();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const damp  = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);

/* ==========================================================================
   시간대 프리셋  (일출 / 오후 3시 / 노을)
   ========================================================================== */
const PRESETS = {
  sunrise: {
    skyTop: '#2a2f6e', skyMid: '#ff8f74', skyHorizon: '#ffc48f', haze: '#ffc79a',
    sunColor: '#ffd7a3', sunIntensity: 2.0, sunElev: 5.0, sunAz: -118,
    deep: '#081d2e', shallow: '#1f6577', foam: '#ffefe0',
    hemiSky: '#ffc6a0', hemiGround: '#3c4a63', hemiInt: 0.75,
    ambient: 0.28, exposure: 1.02, cloud: '#ffd0bd', atm: '#ffb887', stars: 0.15, sunGlow: 1.35
  },
  noon: {
    skyTop: '#0a55a8', skyMid: '#6cbcf0', skyHorizon: '#c9e9f9', haze: '#c9e6f5',
    sunColor: '#fff9ea', sunIntensity: 2.7, sunElev: 34, sunAz: 48,
    deep: '#062338', shallow: '#0f6a80', foam: '#eefaff',
    hemiSky: '#cfeaff', hemiGround: '#7d8a68', hemiInt: 1.05,
    ambient: 0.40, exposure: 1.02, cloud: '#ffffff', atm: '#9dd8ff', stars: 0.0, sunGlow: 0.9
  },
  sunset: {
    skyTop: '#2b1248', skyMid: '#e2566a', skyHorizon: '#ff8a45', haze: '#ff9a5c',
    sunColor: '#ffb072', sunIntensity: 2.35, sunElev: 2.6, sunAz: 118,
    deep: '#101d33', shallow: '#4d3a5c', foam: '#ffe0cb',
    hemiSky: '#ff9f78', hemiGround: '#33304f', hemiInt: 0.62,
    ambient: 0.24, exposure: 1.06, cloud: '#ffbea8', atm: '#ff9a5e', stars: 0.55, sunGlow: 1.9
  }
};

const C = {};                                  // 보간되는 현재 상태
Object.keys(PRESETS.noon).forEach(k => {
  const v = PRESETS.noon[k];
  C[k] = typeof v === 'string' ? new THREE.Color(v) : v;
});
const target = {};                              // 목표 상태
function setPreset(name){
  const p = PRESETS[name] || PRESETS.noon;
  Object.keys(p).forEach(k => {
    if (typeof p[k] === 'string') target[k] = new THREE.Color(p[k]);
    else target[k] = p[k];
  });
}
setPreset('noon');

/* ==========================================================================
   하늘 (그라데이션 + 태양 + 별)
   ========================================================================== */
const skyUniforms = {
  uTop:      { value: C.skyTop },
  uMid:      { value: C.skyMid },
  uHorizon:  { value: C.skyHorizon },
  uSunDir:   { value: new THREE.Vector3(0.3, 0.6, -0.7).normalize() },
  uSunColor: { value: C.sunColor },
  uStars:    { value: 0 },
  uGlow:     { value: 1 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 32),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms,
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop, uMid, uHorizon, uSunColor, uSunDir;
      uniform float uStars, uGlow;
      varying vec3 vDir;
      float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      void main(){
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -1.0, 1.0);
        float e = asin(h);                                   // 고도각(rad)
        vec3 col = mix(uHorizon, uMid, smoothstep(-0.03, 0.26, e));
        col = mix(col, uTop, smoothstep(0.24, 0.62, e));
        col = mix(col, uHorizon * 0.94, smoothstep(0.0, -0.10, h));

        float sd = max(dot(d, normalize(uSunDir)), 0.0);
        col += uSunColor * pow(sd, 420.0) * 7.0 * uGlow;          // 태양 원반
        col += uSunColor * pow(sd, 42.0)  * 0.65 * uGlow;          // 내광
        col += uSunColor * pow(sd, 5.0)   * 0.22 * uGlow;          // 대기 산란
        col += uSunColor * pow(sd, 1.6)   * 0.05 * uGlow * (1.0 - smoothstep(0.05, 0.5, h));

        if (uStars > 0.001 && h > 0.02) {
          vec2 g = floor(d.xz / max(d.y, 0.12) * 260.0);
          float s = hash(g);
          float tw = 0.6 + 0.4 * sin(hash(g + 3.0) * 30.0);
          float star = smoothstep(0.9965, 1.0, s) * tw;
          col += vec3(star) * uStars * smoothstep(0.05, 0.4, h);
        }

   바다 (Gerstner 파도 + 반사 + 거품)
   ========================================================================== */
const OCEAN_VERT = `
  uniform float uTime;
  uniform vec2 uIslandC;
  uniform vec2 uIslandR;
  varying vec3 vWorld;
  varying vec3 vNormal;
  varying float vCrest;

  vec3 gerstner(vec2 p, vec2 dir, float steep, float len, float speed, float t, inout vec3 tang, inout vec3 bin){
    float k = 6.28318 / len;
    float c = sqrt(9.81 / k);
    vec2 d = normalize(dir);
    float f = k * (dot(d, p) - c * speed * t);
    float a = steep / k;
    float sf = sin(f), cf = cos(f);
    tang += vec3(-d.x * d.x * steep * sf,  d.x * steep * cf, -d.x * d.y * steep * sf);
    bin  += vec3(-d.x * d.y * steep * sf,  d.y * steep * cf, -d.y * d.y * steep * sf);
    return vec3(d.x * a * cf, a * sf, d.y * a * cf);
  }

  void main(){
    vec3 p = (modelMatrix * vec4(position, 1.0)).xyz;
    vec3 tang = vec3(1.0, 0.0, 0.0);
    vec3 bin  = vec3(0.0, 0.0, 1.0);
    vec3 off  = vec3(0.0);
    float crest = 0.0;

    off += gerstner(p.xz, vec2( 1.0,  0.35), 0.15, 17.0, 1.05, uTime, tang, bin);
    off += gerstner(p.xz, vec2(-0.7,  1.0 ), 0.125, 10.0, 1.15, uTime, tang, bin);
    off += gerstner(p.xz, vec2( 0.4, -0.9 ), 0.10, 5.8,  1.30, uTime, tang, bin);
    off += gerstner(p.xz, vec2(-0.9, -0.5 ), 0.075, 3.3,  1.45, uTime, tang, bin);
    off += gerstner(p.xz, vec2( 0.2,  0.9 ), 0.05, 1.9,  1.60, uTime, tang, bin);

    // 얕은 물에서는 파도가 작아진다 (해변을 덮지 않도록)
    float isd = length((p.xz - uIslandC) / uIslandR);
    float shallow = smoothstep(0.82, 2.1, isd);
    off *= mix(0.12, 1.0, shallow);
    vec3 wp = p + off;
    vNormal  = normalize(cross(bin, tang));
    vWorld   = wp;
    vCrest   = off.y;
    gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
  }`;

const OCEAN_FRAG = `
  precision highp float;
  uniform float uTime;
  uniform vec3  uSunDir, uSunColor, uDeep, uShallow, uFoam, uSkyTop, uSkyHorizon;
  uniform float uSunInt, uFogNear, uFogFar;
  uniform vec2  uIslandC;
  uniform vec2  uIslandR;
  varying vec3  vWorld;
  varying vec3  vNormal;
  varying float vCrest;

  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  vec3 skyRefl(vec3 d){
    float h = clamp(d.y, 0.0, 1.0);
    vec3 c = mix(uSkyHorizon, uSkyTop, pow(h, 0.55));
    c += uSunColor * pow(max(dot(d, uSunDir), 0.0), 24.0) * 0.35;
    return c;
  }

  void main(){
    vec3 N = normalize(vNormal);
    vec3 V = normalize(cameraPosition - vWorld);

    // 잔물결 디테일
    float nd = noise(vWorld.xz * 2.1 + vec2(uTime * 0.35, uTime * -0.22));
    float nd2 = noise(vWorld.xz * 6.3 - vec2(uTime * 0.7, uTime * 0.4));
    N = normalize(N + vec3((nd - 0.5) * 0.14, 0.0, (nd2 - 0.5) * 0.14));

    vec3 R = reflect(-V, N);
    float fres = 0.02 + 0.52 * pow(1.0 - max(dot(N, V), 0.0), 5.0);

    // 물 색 (얕은 곳/깊은 곳)
    float depthMix = smoothstep(-0.25, 0.45, vCrest);
    vec3 water = mix(uDeep, uShallow, depthMix * 0.85 + 0.15);
    // 역광 산란 (파도 마루가 밝게 빛남)
    float sss = pow(max(vCrest, 0.0) * 3.0, 1.5) * pow(max(dot(V, -uSunDir), 0.0), 2.0);
    water += uShallow * sss * 0.6;

    vec3 refl = skyRefl(R) * 0.82 + uDeep * 0.18;
    vec3 col = mix(water, refl, clamp(fres, 0.04, 0.58));

    // 태양 반짝임
    vec3 H = normalize(uSunDir + V);
    float spec = pow(max(dot(N, H), 0.0), 420.0);
    float spec2 = pow(max(dot(N, H), 0.0), 34.0);
    col += uSunColor * (spec * 4.2 + spec2 * 0.22) * uSunInt;

    // 마루 거품
    float crestFoam = smoothstep(0.47, 0.60, vCrest) * smoothstep(0.55, 1.0, nd2);
    // 해안 거품
    vec2 q = (vWorld.xz - uIslandC) / uIslandR;
    float isd = length(q);
    float shore = 1.0 - smoothstep(1.0, 1.075, isd);
    float band = 0.5 + 0.5 * sin(isd * 46.0 - uTime * 2.3 + nd * 6.0);
    float shoreFoam = shore * smoothstep(0.15, 0.75, band) * (0.45 + 0.55 * nd2);
    float foam = clamp(crestFoam * 0.9 + shoreFoam, 0.0, 1.0);
    foam *= 0.45 + 0.55 * nd2 * (0.6 + 0.4 * nd);
    foam *= 1.0 - smoothstep(45.0, 120.0, length(cameraPosition - vWorld)) * 0.7;
    col = mix(col, uFoam * (0.92 + 0.08 * uSunInt), foam * 0.55);

    float fogF = smoothstep(uFogNear, uFogFar, length(cameraPosition - vWorld));
    col = mix(col, uSkyHorizon * 0.97, fogF * 0.96);

    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
  }`;

const SAND_A = 5.20, SAND_B = 3.40;
function islandHeight(x, z){
  const dx = (x - islandCenter.x) / SAND_A, dz = (z - islandCenter.z) / SAND_B;
  const r = Math.hypot(dx, dz);
  const dome = Math.cos(clamp(r, 0, 1.55) * Math.PI * 0.5);
  let h = 0.34 * Math.max(dome, 0) ** 1.10;
  h += 0.018 * Math.sin((x - islandCenter.x) * 1.9) * Math.cos((z - islandCenter.z) * 1.7);
  h -= 0.72 * smoothstep(0.94, 1.55, r);
  return h;
}

}

{

function proceduralEarth(w = 2048, h = 1024){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a2f57'); g.addColorStop(0.5, '#0f5c8c'); g.addColorStop(1, '#0a2f57');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalAlpha = 0.35;
  for (let i = 0; i < 900; i++){
    x.beginPath();
    x.arc(Math.random() * w, Math.random() * h, 6 + Math.random() * 26, 0, 7);
    x.fillStyle = Math.random() < 0.5 ? '#125f92' : '#0b4372';
    x.fill();
  }
  x.globalAlpha = 1;
  const LAND = [[10,45,26],[-80,40,28],[-60,-15,22],[22,0,24],[90,45,30],[130,-25,16],
                [-130,52,14],[60,20,14],[170,-70,20],[150,10,10],[-20,-60,18],[105,-4,12]];
  LAND.forEach(([lo, la, r], idx) => {
    const cx = (lo + 180) / 360 * w, cy = (90 - la) / 180 * h, rr = r / 360 * w;
    x.save();
    x.beginPath();
    const N = 46;
    for (let i = 0; i <= N; i++){
      const a = i / N * Math.PI * 2;
      const k = 1 + 0.34 * Math.sin(a * 3 + idx) + 0.2 * Math.sin(a * 5 + idx * 2) + 0.1 * Math.sin(a * 8 + idx);
      const px = cx + Math.cos(a) * rr * k * 1.25, py = cy + Math.sin(a) * rr * k * 0.82;
      i ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath();
    const lg = x.createLinearGradient(cx, cy - rr, cx, cy + rr);
    lg.addColorStop(0, '#4e8f4a'); lg.addColorStop(0.45, '#7aab55'); lg.addColorStop(1, '#c2b47a');
    x.fillStyle = lg; x.fill();
    x.restore();
  });
  // 극지방
  const pg = x.createLinearGradient(0, 0, 0, h);
  pg.addColorStop(0, 'rgba(255,255,255,.92)'); pg.addColorStop(0.10, 'rgba(255,255,255,0)');
  pg.addColorStop(0.90, 'rgba(255,255,255,0)'); pg.addColorStop(1, 'rgba(255,255,255,.92)');
  x.fillStyle = pg; x.fillRect(0, 0, w, h);
  const T = new THREE.CanvasTexture(cv);
  T.colorSpace = THREE.SRGBColorSpace;
  return T;
}
function proceduralClouds(w = 2048, h = 1024){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  x.clearRect(0, 0, w, h);
  for (let band = 0; band < 6; band++){
    const y0 = (0.14 + band * 0.14) * h;
    for (let i = 0; i < 110; i++){
      const px = Math.random() * w;
      const py = y0 + (Math.random() - 0.5) * h * 0.15;
      const r = 8 + Math.random() * 38;
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      const a = 0.10 + Math.random() * 0.20;
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
    }
  }
  const T = new THREE.CanvasTexture(cv);
  T.colorSpace = THREE.SRGBColorSpace;
  return T;
}
function proceduralNight(w = 1024, h = 512){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++){
    const px = Math.random() * w, py = h * 0.2 + Math.random() * h * 0.62;
    const r = Math.random() * 1.5 + 0.4;
    x.fillStyle = `rgba(255,${180 + Math.random() * 60 | 0},${120 + Math.random() * 60 | 0},${0.35 + Math.random() * 0.5})`;
    x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  const T = new THREE.CanvasTexture(cv);
  T.colorSpace = THREE.SRGBColorSpace;
  return T;
}

const M = makeMascot(), D = makeDog(), K = makeCat();

globeGroup.add(P.group);

  obj: P,
  angle: 0.6,

  walkPhase: 0,
  wave: 0,
  lat: 0.44
};

function placeOnSand(obj, x, z){ obj.position.set(x, islandHeight(x, z), z); }

const critter = {
  mascot: { obj: M, pos: new THREE.Vector3(innerWidth <= 860 ? -0.35 : -0.75, 0, 2.15), target: new THREE.Vector3(), speed: 0, goal: 0, heading: Math.PI, phase: 0, wait: 1, jump: 0, jumpV: 0, wave: 0 },
  dog:    { obj: D, pos: new THREE.Vector3(innerWidth <= 860 ? 0.30 : 0.55, 0, 2.45),  target: new THREE.Vector3(), speed: 0, goal: 0, heading: 0, phase: 0, wait: 0.2, jump: 0, jumpV: 0 },
  cat:    { obj: K, pos: new THREE.Vector3(innerWidth <= 860 ? 0.62 : 1.25, 0, 2.0), target: new THREE.Vector3(), speed: 0, goal: 0, heading: 0, phase: 0, wait: 0, jump: 0, jumpV: 0, pounce: 0 }
};

const MOVE_CX = islandCenter.x, MOVE_CZ = islandCenter.z;
const MOVE_RX = innerWidth <= 860 ? 0.80 : 2.05;
const MOVE_RZ = innerWidth <= 860 ? 0.40 : 1.05;

function randomSpot(out, scale = 1){
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * scale;
  out.set(MOVE_CX + Math.cos(a) * MOVE_RX * r, 0, MOVE_CZ + Math.sin(a) * MOVE_RZ * r);
  return out;
}
function clampToSand(p){
  const dx = (p.x - MOVE_CX) / MOVE_RX, dz = (p.z - MOVE_CZ) / MOVE_RZ;
  const d = Math.hypot(dx, dz);
  if (d > 1){ p.x = MOVE_CX + dx / d * MOVE_RX; p.z = MOVE_CZ + dz / d * MOVE_RZ; }
  return p;
}
const angDiff = (a, b) => { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; };

function stepCritter(c, dt, t, opts){
  c.wait -= dt;
  const dist = Math.hypot(c.target.x - c.pos.x, c.target.z - c.pos.z);
  if (opts.chaseTarget) c.target.copy(opts.chaseTarget);
  else if (c.wait <= 0 || dist < 0.12){
    randomSpot(c.target, 0.95);
    c.wait = rand(0.9, 2.6);
    c.goal = opts.speed * rand(0.75, 1.15);
  }
  const dx = c.target.x - c.pos.x, dz = c.target.z - c.pos.z;
  const d2 = Math.hypot(dx, dz);
  const desired = c.wait > 0 && !opts.chaseTarget ? 0 : (d2 > 0.14 ? c.goal : 0);
  if (d2 > 0.05) c.heading += angDiff(Math.atan2(dx, dz), c.heading) * (1 - Math.exp(-8 * dt));
  c.speed = damp(c.speed, opts.chaseTarget ? clamp((d2 - 0.45) * 2.0, 0, opts.speed * 1.6) : desired, 5, dt);
  c.pos.x += Math.sin(c.heading) * c.speed * dt;
  c.pos.z += Math.cos(c.heading) * c.speed * dt;
  clampToSand(c.pos);
  c.phase += c.speed * dt * 9;

  // 점프
  if (c.jumpV !== 0 || c.jump > 0){
    c.jump += c.jumpV * dt;
    c.jumpV -= 5.5 * dt;
    if (c.jump <= 0){ c.jump = 0; c.jumpV = 0; }
  } else if (Math.random() < dt * 0.25 && c.speed > 0.3){
    c.jumpV = 1.0 + Math.random() * 0.4;
  }

  const gy = islandHeight(c.pos.x, c.pos.z);
  c.obj.group.position.set(c.pos.x, gy + c.jump, c.pos.z);
  c.obj.group.rotation.y = c.heading + Math.PI;
}

function animateDog(dt, t){
  const c = critter.dog, o = c.obj;
  const run = clamp(c.speed / 1.1, 0, 1);
  o.legs.forEach((l, i) => { l.rotation.x = Math.sin(c.phase + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI : 0)) * 0.75 * run; });
  o.tail.rotation.y = Math.sin(t * (5 + run * 12)) * 0.55;
  o.head.rotation.z = Math.sin(c.phase) * 0.06 * run;
  o.head.rotation.x = -0.1 + Math.sin(t * 2.2) * 0.04;
  o.earL.rotation.x = -0.2 + Math.sin(c.phase * 0.9) * 0.22 * run;
  o.earR.rotation.x = -0.2 + Math.cos(c.phase * 0.9) * 0.22 * run;
  o.group.position.y += Math.abs(Math.sin(c.phase)) * 0.025 * run;
}

function animateCat(dt, t){
  const c = critter.cat, o = c.obj;
  const run = clamp(c.speed / 1.1, 0, 1);
  o.legs.forEach((l, i) => { l.rotation.x = Math.sin(c.phase + (i % 2 ? Math.PI : 0) + (i > 1 ? Math.PI : 0)) * 0.7 * run; });
  o.tail.rotation.y = Math.sin(t * 2.4) * (0.18 + run * 0.22);
  o.tail.rotation.z = Math.sin(t * 1.7) * 0.10;
  o.head.rotation.y = Math.sin(t * 0.8) * 0.25 * (1 - run);
  o.head.rotation.x = Math.sin(t * 1.3) * 0.05;
  o.group.position.y += Math.abs(Math.sin(c.phase)) * 0.02 * run;
}

function animateMascot(dt, t){
  const c = critter.mascot, o = c.obj;
  const walk = clamp(c.speed / 0.7, 0, 1);
  o.feetL.rotation.x = Math.sin(c.phase) * 0.6 * walk;
  o.feetR.rotation.x = -Math.sin(c.phase) * 0.6 * walk;
  o.group.position.y += Math.abs(Math.sin(c.phase)) * 0.02 * walk;
  // 팔 흔들기
  const wave = c.wave > 0 ? Math.sin(t * 9) * 0.9 : 0;
  o.armL.rotation.z = 0.5 + Math.sin(c.phase) * 0.4 * walk;
  o.armR.rotation.z = -(0.5 + Math.sin(c.phase + Math.PI) * 0.4 * walk) - (wave > 0 ? 0.9 + wave * 0.35 : 0);
  // 고개 갸우뚱
  o.head.rotation.z = Math.sin(t * 0.9) * 0.06;
  o.face.rotation.y = Math.sin(t * 0.5) * 0.12;
  o.sprout.rotation.z = Math.sin(t * 1.6) * 0.12;
  if (c.wave > 0) c.wave -= dt;
}

function cloudTexture(){
  const S = 512, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const x = cv.getContext('2d');
  x.clearRect(0, 0, S, S);
  for (let i = 0; i < 22; i++){
    const px = S * 0.5 + (Math.random() - 0.5) * S * 0.62;
    const py = S * 0.55 + (Math.random() - 0.5) * S * 0.34;
    const r = S * (0.10 + Math.random() * 0.20);
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    g.addColorStop(0, 'rgba(255,255,255,.5)');
    g.addColorStop(0.55, 'rgba(255,255,255,.22)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath(); x.arc(px, py, r, 0, 7); x.fill();
  }
  const T = new THREE.CanvasTexture(cv);
  T.colorSpace = THREE.SRGBColorSpace;
  return T;
}

let dragging = false, lastX = 0, lastY = 0, pointerId = null, pinchDist = 0;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (e.button === 2 || e.pointerType === 'touch'){
    dragging = true; pointerId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    cam.autoSpin = 0;
    canvas.style.cursor = 'grabbing';
  }
  startAudio();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging || e.pointerId !== pointerId) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  cam.spinY += dx * 0.0055;
  cam.spinX = clamp(cam.spinX + dy * 0.0045, -0.75, 0.75);
});
function endDrag(e){
  if (e.pointerId !== pointerId) return;
  dragging = false; pointerId = null; canvas.style.cursor = '';
  setTimeout(() => { cam.autoSpin = 1; }, 2600);
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoomGoal = clamp(cam.zoomGoal * Math.exp(-e.deltaY * 0.0011), 0.62, 1.9);
  startAudio();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 2){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinchDist) cam.zoomGoal = clamp(cam.zoomGoal * (d / pinchDist), 0.62, 1.9);
    pinchDist = d;
  }
}, { passive: true });
canvas.addEventListener('touchend', () => { pinchDist = 0; });

function updateCamera(dt){
  cam.shift = damp(cam.shift, document.body.classList.contains('open') ? 1 : 0, 4.2, dt);
  cam.zoom = damp(cam.zoom, cam.zoomGoal, 4.5, dt);

  // 방향키 이동
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const ay = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  move.vx = damp(move.vx, ax * 1.5, 6, dt);
  move.vy = damp(move.vy, ay * 1.0, 6, dt);
  move.x = clamp(move.x + move.vx * dt, -2.4, 2.4);
  move.y = clamp(move.y + move.vy * dt, -1.25, 1.5);

  const fov = camera.fov * DEG;
  const baseDist = 2 / Math.tan(fov / 2);            // 지구 지름 = 화면 높이의 50%
  const fitDist = isSmall() ? baseDist * 1.25 : Math.max(baseDist, 2 / (0.8 * Math.tan(fov / 2) * camera.aspect));
  const dist = fitDist / cam.zoom * (1 + 0.66 * cam.shift);
  const visH = 2 * dist * Math.tan(fov / 2);
  const visW = visH * camera.aspect;

  let ox = 0, oy = 0;
  if (cam.shift > 0.001){
    if (isSmall()){
      oy = -0.20 * visH * cam.shift;
    } else {
      const panelW = Math.min(460, innerWidth);
      ox = (panelW / 2) / innerWidth * visW * cam.shift;
    }
  }
  camera.position.set(ox, cam.lookY + cam.eye, dist);
  camera.lookAt(ox, cam.lookY + oy, 0);

  globeGroup.position.x = move.x;
  globeGroup.position.y = cam.lookY + move.y;

  // 자동 회전
  cam.spinY += cam.autoSpin * dt * 0.055;
  spin.rotation.y = cam.spinY;
  spin.rotation.x = cam.spinX;
  globeClouds.rotation.y = cam.spinY * 0.22;
  nightShell.rotation.y = cam.spinY;
}

const sunDir = new THREE.Vector3();

function updatePreset(dt){
  const k = 1 - Math.exp(-1.9 * dt);
  for (const key in target){
    if (target[key] instanceof THREE.Color) C[key].lerp(target[key], k);
    else C[key] = lerp(C[key], target[key], k);
  }
  const el = C.sunElev * DEG, az = C.sunAz * DEG;
  sunDir.set(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).normalize();

  skyUniforms.uSunDir.value.copy(sunDir);
  skyUniforms.uStars.value = C.stars;
  skyUniforms.uGlow.value = C.sunGlow;
  oceanUniforms.uSunDir.value.copy(sunDir);
  oceanUniforms.uSunInt.value = clamp(C.sunIntensity / 2.2, 0.4, 2.0);
  oceanUniforms.uDeep.value.copy(C.deep);
  oceanUniforms.uShallow.value.copy(C.shallow);
  oceanUniforms.uFoam.value.copy(C.foam);
  oceanUniforms.uSkyTop.value.copy(C.skyTop);
  oceanUniforms.uSkyHorizon.value.copy(C.skyHorizon);

  sun.color.copy(C.sunColor);
  sun.intensity = C.sunIntensity;
  sun.position.copy(sunDir).multiplyScalar(11).add(sun.target.position);
  hemi.color.copy(C.hemiSky);
  hemi.groundColor.copy(C.hemiGround);
  hemi.intensity = C.hemiInt;
  fill.intensity = 0.22 + C.hemiInt * 0.22;
  fill.color.copy(C.sunColor);
  renderer.toneMappingExposure = C.exposure;

  atmosMat.uniforms.uColor.value.copy(C.atm);
  atmosMat.uniforms.uPower.value = 0.75 + C.sunGlow * 0.35;
  nightMat.uniforms.uSunDir.value.copy(sunDir);
  nightMat.uniforms.uIntensity.value = clamp(1.35 - C.sunElev * 0.028, 0, 1.35);
  cloudMats.forEach(m => m.color.copy(C.cloud));
  sky.material.uniforms.uSunColor.value.copy(C.sunColor);
}

/* ==========================================================================
   파도 소리 (WebAudio 합성)
   ========================================================================== */
const Sound = (() => {
  let ctx = null, master = null, comp = null, layers = [], started = false;
  let muted = false, gullTimer = null;

  function noiseBuffer(kind, seconds = 5){
    const sr = ctx.sampleRate, len = sr * seconds;
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      let last = 0, b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++){
        const w = Math.random() * 2 - 1;
        if (kind === 'brown'){ last = (last + 0.02 * w) / 1.02; d[i] = last * 3.4; }
        else if (kind === 'pink'){
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
          b6 = w * 0.115926;
        } else d[i] = w;
      }
    }
    return buf;
  }
  function setGain(param, v, time = 0.4){
    param.cancelScheduledValues(ctx.currentTime);
    param.setTargetAtTime(v, ctx.currentTime, time);
  }
  function build(){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 20; comp.ratio.value = 3;
    comp.attack.value = 0.02; comp.release.value = 0.4;
    master.connect(comp); comp.connect(ctx.destination);
    // 사용자 음량
    master.gain.value = muted ? 0 : 0.0;

    const mk = (kind, filterType, freq, q, base, sway, swaySpeed, pan) => {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer(kind, 6); src.loop = true;
      const flt = ctx.createBiquadFilter();
      flt.type = filterType; flt.frequency.value = freq; flt.Q.value = q;
      const g = ctx.createGain(); g.gain.value = base;
      const amp = ctx.createGain(); amp.gain.value = sway;
      const lfo = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = swaySpeed;
      const p = ctx.createStereoPanner(); p.pan.value = pan;
      lfo.connect(amp); amp.connect(g.gain);
      src.connect(flt); flt.connect(g); g.connect(p); p.connect(master);
      src.start(); lfo.start();
      return { src, flt, g, base, sway };
    };

    // 낮고 깊은 파도 소리 / 밀려오는 물결 / 부서지는 거품
    layers.push(mk('brown', 'lowpass', 420, 0.8, 0.16, 0.13, 0.085, -0.25));
    layers.push(mk('pink',  'bandpass', 760, 0.6, 0.10, 0.085, 0.127, 0.3));
    layers.push(mk('white', 'highpass', 2600, 0.5, 0.011, 0.020, 0.21, 0.0));
    const wind = mk('pink', 'lowpass', 520, 0.7, 0.03, 0.018, 0.06, -0.55);
    layers.push(wind);
    started = true;
    master.gain.setTargetAtTime(muted ? 0 : 0.72, ctx.currentTime, 1.4);
    scheduleGull();
  }

  function gull(){
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + 0.05;
    const pan = ctx.createStereoPanner();
    pan.pan.value = rand(-0.75, 0.75);
    pan.connect(master);
    const calls = 2 + (Math.random() * 2 | 0);
    for (let i = 0; i < calls; i++){
      const t = t0 + i * 0.34;
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(1150 + Math.random() * 260, t);
      o.frequency.exponentialRampToValueAtTime(640 + Math.random() * 120, t + 0.26);
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 7;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(f); f.connect(g); g.connect(pan);
      o.start(t); o.stop(t + 0.34);
    }
  }
  function scheduleGull(){
    clearTimeout(gullTimer);
    gullTimer = setTimeout(() => { gull(); scheduleGull(); }, rand(9000, 21000));
  }
  function start(){
    if (muted) return;
    if (!ctx){ try { build(); } catch (e) { console.warn('audio', e); } }
    else if (ctx.state === 'suspended') ctx.resume();
  }
  function toggle(){
    muted = !muted;
    if (!muted) start();
    if (ctx && master) master.gain.setTargetAtTime(muted ? 0 : 0.72, ctx.currentTime, 0.35);
    return muted;
  }
  return { start, toggle, get muted(){ return muted; }, get ready(){ return started; } };
})();

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function relTime(iso){
  const t = new Date(iso).getTime();
  const d = Math.max(0, (Date.now() - t) / 1000);
  if (d < 60) return '방금 전';
  if (d < 3600) return `${Math.floor(d / 60)}분 전`;
  if (d < 86400) return `${Math.floor(d / 3600)}시간 전`;
  if (d < 86400 * 7) return `${Math.floor(d / 86400)}일 전`;
  return new Date(iso).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });
}

function renderList(kind){
  const list = document.getElementById(kind === 'board' ? 'boardList' : 'guestList');
  const counter = document.getElementById(kind === 'board' ? 'boardCount' : 'guestCount');
  const items = state[kind];
  const isLocal = kind === 'board' ? state.boardLocal : state.guestLocal;
  if (counter) counter.textContent = items.length ? `${items.length}개의 ${kind === 'board' ? '글' : '방명록'}` : '';
  if (isLocal && !document.querySelector('.note[data-kind="' + kind + '"]')){
    const note = document.createElement('div');
    note.className = 'setup-note';
    note.innerHTML = setupNote();
    note.dataset.kind = kind;
    note.firstElementChild.dataset.kind = kind;
    list.parentNode.insertBefore(note.firstElementChild, list);
    bindSqlCopy();
  }
  if (!items.length){
    list.innerHTML = `<div class="empty"><span class="big">${kind === 'board' ? '🌊' : '🐚'}</span>
      ${kind === 'board' ? '아직 글이 없어요' : '아직 방명록이 비어 있어요'}<br>첫 번째 이야기를 남겨 주세요.</div>`;
    return;
  }
  list.innerHTML = items.map(it => {
    const initial = esc(String(it.name || '?').trim().slice(0, 1) || '?');
    const when = it.created_at ? relTime(it.created_at) : '';
    if (kind === 'board'){
      return `<article class="card">
        <h3>${esc(it.title)}</h3>
        <div class="meta"><span class="avatar">${initial}</span>${esc(it.name)} · ${when}</div>

    }
    return `<article class="card">
      <div class="meta"><span class="avatar">${initial}</span>${esc(it.name)} · ${when}</div>
      <p>${esc(it.message)}</p></article>`;
  }).join('');
}

async function loadPosts(kind){
  const table = TABLES[kind];
  if (!sbReady) { state[kind] = localStore(kind); state[kind + 'Local'] = true; renderList(kind); setLive(false, '로컬 모드'); return; }
  try {
    const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false }).limit(60);
    if (error) throw error;
    state[kind] = data || [];
    state[kind + 'Local'] = false;
    document.querySelectorAll(`.note-wrap[data-kind="${kind}"]`).forEach(n => n.remove());
    setLive(true, '실시간 연결');
    renderList(kind);
  } catch (err){
    console.warn(table, err);
    if (err && (err.code === 'PGRST205' || /Could not find the table/i.test(err.message || ''))){
      sbBroken = true;
      state[kind] = localStore(kind);
      state[kind + 'Local'] = true;
      setLive(false, '로컬 모드');
    } else {
      state[kind] = state[kind].length ? state[kind] : localStore(kind);
      setLive(false, '연결 오류');
      toast('게시판을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
    }
    renderList(kind);
  }
}

async function addPost(kind, payload){
  const table = TABLES[kind];
  if (!sbReady || (kind === 'board' ? state.boardLocal : state.guestLocal)){
    const row = { ...payload, id: Date.now(), created_at: new Date().toISOString() };
    state[kind].unshift(row);
    localSave(kind, state[kind]);
    renderList(kind);
    return { ok: true, local: true };
  }
  const { data, error } = await sb.from(table).insert(payload).select();
  if (error) return { ok: false, error };
  if (data && data[0]){
    state[kind].unshift(data[0]);
    renderList(kind);
  } else {
    await loadPosts(kind);
  }
  return { ok: true };
}

const tmpV = new THREE.Vector3();
const tmpUp = new THREE.Vector3();
const tmpTan = new THREE.Vector3();
const tmpRight = new THREE.Vector3();
const princeM4 = new THREE.Matrix4();

function updateWorld(dt, t){
  oceanUniforms.uTime.value = t;
  sky.position.copy(camera.position);

  // 지구를 도는 어린왕자
  if (prince){
    prince.angle += prince.speed * dt;
    prince.walkPhase += dt * 7.5;
    if (Math.random() < dt * 0.08) prince.wave = 1.6;

    const lat = prince.lat;
    const cosLat = Math.cos(lat), sinLat = Math.sin(lat);
    const r = 1.006;

    const px = Math.sin(prince.angle) * cosLat * r;
    const py = sinLat * r;
    const pz = Math.cos(prince.angle) * cosLat * r;

    const pUp = tmpUp.set(px, py, pz).normalize();
    const pTan = tmpTan.set(Math.cos(prince.angle), 0, -Math.sin(prince.angle)).normalize();
    const pRight = tmpRight.crossVectors(pTan, pUp).normalize();

    const bob = Math.abs(Math.sin(prince.walkPhase)) * 0.014;
    princeM4.makeBasis(pRight, pUp, pTan.negate());
    prince.obj.group.quaternion.setFromRotationMatrix(princeM4);
    prince.obj.group.position.set(px, py, pz).addScaledVector(pUp, bob);

    const walkSin = Math.sin(prince.walkPhase);
    prince.obj.legL.rotation.x = walkSin * 0.65;
    prince.obj.legR.rotation.x = -walkSin * 0.65;

    const waveArm = prince.wave > 0 ? Math.sin(t * 10) * 0.85 : 0;
    prince.obj.armL.rotation.x = -walkSin * 0.5;
    prince.obj.armR.rotation.x = waveArm !== 0 ? -1.8 + waveArm * 0.35 : walkSin * 0.5;
    prince.obj.armR.rotation.z = waveArm !== 0 ? -0.45 : 0;
    if (prince.wave > 0) prince.wave -= dt;

    prince.obj.scarfTails.forEach((tail, idx) => {
      const w1 = Math.sin(t * 8.5 + idx * 1.5);
      const w2 = Math.cos(t * 6.5 + idx * 1.2);
      tail.root.rotation.x = 0.28 + w1 * 0.12;
      tail.s1.rotation.y = w1 * 0.25;
      tail.s2.rotation.y = w2 * 0.35;
      tail.s3.rotation.y = w1 * 0.45;
      tail.s2.rotation.x = 0.14 + w2 * 0.12;
    });

    if (prince.obj.hairTuft1) prince.obj.hairTuft1.rotation.z = 0.45 + Math.sin(t * 5) * 0.1;
    if (prince.obj.hairTuft2) prince.obj.hairTuft2.rotation.z = -0.45 - Math.sin(t * 5.5) * 0.1;
  }

  // 지구니
  const c = critter.mascot;
  stepCritter(c, dt, t, { speed: 0.42 });
  if (Math.random() < dt * 0.09) c.wave = 1.2;
  animateMascot(dt, t);

  // 강아지 (자유롭게 뛰어다님)
  stepCritter(critter.dog, dt, t, { speed: 1.05 });
  animateDog(dt, t);

  // 고양이 (강아지를 계속 따라감)
  const dogPos = critter.dog.pos;
  const off = tmpV.set(Math.sin(critter.dog.heading + 2.4) * 0.42, 0, Math.cos(critter.dog.heading + 2.4) * 0.42).add(dogPos);
  stepCritter(critter.cat, dt, t, { speed: 0.85, chaseTarget: off });
  animateCat(dt, t);

  // 구름
  clouds.forEach(cl => {
    cl.position.x += cl.userData.speed * dt;
    if (cl.position.x > 78) cl.position.x = -78;
    cl.position.y = cl.userData.baseY + Math.sin(t * 0.35 + cl.userData.phase) * 0.35;
  });

  // 갈매기
  gulls.forEach(g => {
    g.a += g.sp * dt;
    const x = Math.cos(g.a) * g.r, z = g.cz + Math.sin(g.a) * g.r * 0.55;
    g.g.position.set(x, g.y + Math.sin(g.a * 2.2) * 0.4, z);
    g.g.rotation.y = -g.a + Math.PI / 2;
    const flap = Math.sin(t * 7 + g.ph) * 0.65;
    g.g.userData.lg.rotation.z = flap;
    g.g.userData.rg.rotation.z = -flap;
  });
}

function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isSmall() ? 1.6 : 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 250));

let last = performance.now(), started = false;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000) || 0.016;
  last = now;
  const t = clock.getElapsedTime();

  updatePreset(dt);
  updateCamera(dt);
  updateWorld(dt, t);

  renderer.render(scene, camera);
  if (!started){
    started = true;
    document.getElementById('boot').classList.add('done');
    setTimeout(() => loadPosts('board'), 400);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
